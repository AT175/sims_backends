services:
  - type: web
    name: sims-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: curl -o global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem && npm install && npm run build && npm run seed
    startCommand: node dist/main.js
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: sims.czsimqw60v3d.sa-east-1.rds.amazonaws.com
      - key: DB_PORT
        value: 5432
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        value: Echendaa
      - key: DB_DATABASE
        value: postgres
      - key: JWT_SECRET
        value: sims-jwt-secret-2026-change-me
      - key: JWT_REFRESH_SECRET
        value: sims-refresh-secret-2026-change-me
      - key: CORS_ORIGIN
        value: https://sims-frontend.netlify.app
